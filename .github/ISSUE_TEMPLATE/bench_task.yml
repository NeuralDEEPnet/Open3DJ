name: Bench task proposal
description: Propose a task for o3dj-bench, with a brief, executable assertions, a reference solution and a seeded mutant that task-lint checks.
title: "[Bench]: "
labels: ["bench", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for adding to o3dj-bench. A task is a folder `bench/tasks/<id>/` with `task.json` (the C7 schema in `packages/schemas/json/bench-task.schema.json`), `reference.o3j.js` and `mutant.o3j.js`. Read [bench/README.md](https://github.com/NeuralDEEPnet/Open3DJ/blob/main/bench/README.md) first.

        **task-lint does the first review.** Before you submit, run `node bench/lint.ts <id>` and paste its output below. It checks the schema, that the reference passes every assertion, and that the mutant fails at least one.

        Tasks must be original or built from this repository, and MIT licensed. Do not copy briefs or models from other benchmarks or from paid standards.

  - type: input
    id: task-id
    attributes:
      label: Task id
      description: "reg-<name> for the regression split, cap-<name> for the capability split. Lower case, digits and hyphens."
      placeholder: cap-handheld-torch
    validations:
      required: true

  - type: dropdown
    id: split
    attributes:
      label: Split
      options:
        - "regression: deterministic replay of the reference, no agent, must stay at 100%"
        - "capability: agents get the brief and are scored by pass^3"
    validations:
      required: true

  - type: textarea
    id: brief
    attributes:
      label: Brief
      description: The request as a client would write it, with the sizes and names the assertions check. Agents see only this text in a capability run.
    validations:
      required: true

  - type: textarea
    id: task-json
    attributes:
      label: task.json
      description: The whole file, with its assertions and their tolerances.
      render: json
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: reference.o3j.js
      render: js
    validations:
      required: true

  - type: textarea
    id: mutant
    attributes:
      label: mutant.o3j.js and its seeded defect
      description: The mutant is the reference with one realistic defect, marked with a MUTANT comment. Say which assertions catch it.
      render: js
    validations:
      required: true

  - type: textarea
    id: lint
    attributes:
      label: task-lint output
      description: "Paste the output of: node bench/lint.ts <task id>"
      render: text
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Where does the task come from?
      options:
        - Original, written for Open3DJ
        - Built from an example or file in this repository
        - From a failure report (link it below)
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Related issue or failure report
      placeholder: "#123"
    validations:
      required: false

  - type: dropdown
    id: ai-assistance
    attributes:
      label: Did AI tools help you write this task?
      description: AI help is welcome. A person must check the brief, the assertions and both scripts before this is submitted (AI_POLICY.md).
      options:
        - "No, I wrote it without AI tools"
        - "Yes, AI tools helped me write or research it"
        - "Yes, an AI agent drafted or filed it for me, and I checked it"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: task-lint passes for this task on my machine.
          required: true
        - label: The task is original or built from this repository, and I agree to license it under MIT.
          required: true
        - label: Every dimension in the brief is either the client's own requirement or has a cited, shareable source.
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/NeuralDEEPnet/Open3DJ/blob/main/CODE_OF_CONDUCT.md).
          required: true
