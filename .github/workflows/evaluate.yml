name: Evaluate
run-name: "Evaluate #${{ github.event.pull_request.number }}"

# The "evaluate" check: which merge lane a pull request is in (.github/merge-policy.json).
# It runs the default branch's evaluator, never the pull request's code, and reads the
# changed files through the GitHub API. The automerge workflow repeats the evaluation from
# the default branch on its own, so this check is a report for people, not the gate.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: evaluate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch's evaluator
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            /scripts/automerge/
            /.github/merge-policy.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Evaluate the merge lane
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/automerge/cli.ts evaluate
