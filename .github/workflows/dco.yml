name: DCO
run-name: "DCO #${{ github.event.pull_request.number }}"

# The "dco" check: every commit in a pull request needs a Signed-off-by line whose email
# matches the commit author or committer (Developer Certificate of Origin, CONTRIBUTING.md).
# It reads the commits through the GitHub API and never runs the pull request's code.
#
# ship-it: on a pull request from this repository, when its author (a maintainer, with a user
# account) adds the `ship-it` label, the same step first records a `ship-it` commit status on
# the head commit named in the labeled event, then checks the commits. That status is the
# author's DCO certification for every commit and their approval, so dco passes without
# Signed-off-by lines. After a push it removes the stale label (the new commit needs a new
# tap); when the label comes off it records a withdrawal. Any other person's or a bot's
# label is ignored. Fork pull requests are checked exactly as before. No bot ever writes a
# Signed-off-by line. See scripts/automerge/README.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

# pull-requests: write removes a stale ship-it label after a push; statuses: write records a
# ship-it certification or withdrawal on the labeled commit. They are used only on pull
# requests from this repository: GitHub gives fork pull requests a read-only token whatever
# this asks for.
permissions:
  contents: read
  pull-requests: write
  statuses: write

# A push cancels the run for the older commit. A label change never cancels a run: it waits
# its turn, so a ship-it tap is recorded before the next run checks the commits.
concurrency:
  group: dco-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch's checker
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            /scripts/automerge/
            /.github/merge-policy.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Record a ship-it tap, then check every commit for a sign-off
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/automerge/cli.ts dco
