name: DCO
run-name: "DCO #${{ github.event.pull_request.number }}"

# The "dco" check: every commit in a pull request needs a Signed-off-by line whose email
# matches the commit author or committer (Developer Certificate of Origin, CONTRIBUTING.md).
# It reads the commits through the GitHub API and never runs the pull request's code.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dco-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch's checker
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            /scripts/automerge/
            /.github/merge-policy.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check every commit for a sign-off
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/automerge/cli.ts dco
